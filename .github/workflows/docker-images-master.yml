name: Docker Images Master CI

on:
  push:
    tags:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    -
      name: Checkout
      uses: actions/checkout@v7
    -
      name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Get current date
      id: date
      run: echo "date=$(date +'%s')" >> $GITHUB_OUTPUT
    -
      name: Build and push Core
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Core/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/core:latest,${{ secrets.DOCKER_HUB_USERNAME }}/core:${{ steps.date.outputs.date }}
    -
      name: Build and push Discord
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Discord/Dockerfile
        push: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/discord:latest,${{ secrets.DOCKER_HUB_USERNAME }}/discord:${{ steps.date.outputs.date }}