name: Docker Images Beta CI

on:
  push:
    branches:
      - develop
    paths-ignore:
      - 'Lang/**'
  workflow_dispatch:

# Serialize the pushes so that the latest tag always points to the most recent build.
# A pending run is replaced by a newer push, which only skips intermediate commits of the branch.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    -
      name: Checkout
      uses: actions/checkout@v7
    -
      name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    -
      name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
    - name: Get current date
      id: date
      run: echo "date=$(date +'%s')" >> "$GITHUB_OUTPUT"
    -
      name: Build and push Core
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Core/Dockerfile
        push: true
        pull: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/core-beta:latest,${{ secrets.DOCKER_HUB_USERNAME }}/core-beta:${{ steps.date.outputs.date }}
    -
      name: Build and push Discord
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./Discord/Dockerfile
        push: true
        pull: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/discord-beta:latest,${{ secrets.DOCKER_HUB_USERNAME }}/discord-beta:${{ steps.date.outputs.date }}
    -
      name: Build and push RestWs
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ./RestWs/Dockerfile
        push: true
        pull: true
        tags: ${{ secrets.DOCKER_HUB_USERNAME }}/restws-beta:latest,${{ secrets.DOCKER_HUB_USERNAME }}/restws-beta:${{ steps.date.outputs.date }}
