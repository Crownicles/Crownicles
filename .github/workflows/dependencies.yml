name: Dependencies
on:
  pull_request:
    branches:
      - '**'
    paths:
      - '**/package.json'
      - '**/pnpm-lock.yaml'
      - '**/Dockerfile'
      - .github/actions/**
      - .github/workflows/dependencies.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Only fails on vulnerabilities introduced by the pull request, not on the ones already present on the base branch
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Review the added dependencies
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # GHSA-qr28-fpjm-wq7f, a denial of service of decode-uri-component 0.2 on a crafted link, is only
          # fixed in 0.5.1, an ES module out of the ^0.2 that query-string 7 requires. expo-router 57 and
          # @react-navigation/core 7.12 both read the app's links with that query-string. Remove once the app is on
          # Expo SDK 58 and @react-navigation/native 7.5: neither expo-router 58 nor @react-navigation/core 7.24
          # uses query-string any more (#5122).
          allow-ghsas: GHSA-qr28-fpjm-wq7f

  pnpm-version-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check that every module and Dockerfile use the same pnpm version
        run: |
          versions=$(
            for file in */package.json; do
              echo "$file $(jq -r '.packageManager // "missing"' "$file" | sed -E 's/^pnpm@([^+]+).*/\1/')"
            done
            for file in */Dockerfile; do
              grep -E '^ARG PNPM_VERSION=' "$file" | sed -E "s|^ARG PNPM_VERSION=|$file |"
            done
          )
          echo "$versions"
          if [ "$(echo "$versions" | awk '{ print $2 }' | sort -u | wc -l)" -ne 1 ]; then
            echo "::error title=pnpm version mismatch::All packageManager fields and Dockerfile PNPM_VERSION arguments must use the same pnpm version"
            exit 1
          fi
