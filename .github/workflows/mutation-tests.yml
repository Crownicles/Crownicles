name: Mutation Tests

# Mutates the files listed in `mutate` of each stryker.config.mjs (#5165). Does not block the pull requests, but fails and
# reports it in an issue when a mutated file falls under the floor of MIN_FILE_SCORE.
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  MIN_FILE_SCORE: 75

jobs:
  mutation-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        module: [ Lib, Core ]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js and PNPM
        uses: ./.github/actions/setup-pnpm

      - name: Cache PNPM dependencies
        uses: actions/cache@v6
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-all-deps-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-all-deps-

      - name: Install dependencies
        run: |
          pnpm --dir ./Lib install --frozen-lockfile
          pnpm --dir ./${{ matrix.module }} install --frozen-lockfile

      - name: Create config file
        if: matrix.module == 'Core'
        run: cp config/config.default.toml config/config.toml
        working-directory: ./Core

      # Stryker only retests the mutants whose code or tests changed since the previous run
      - name: Restore incremental mutation results
        uses: actions/cache@v6
        with:
          path: ${{ matrix.module }}/reports/stryker-incremental.json
          key: stryker-incremental-${{ matrix.module }}-${{ github.run_id }}
          restore-keys: |
            stryker-incremental-${{ matrix.module }}-

      - name: Run mutation tests
        run: pnpm --dir ./${{ matrix.module }} test:mutation

      - name: Mutation summary
        if: always()
        run: node .github/scripts/test-reports-summary.mjs mutation ${{ matrix.module }} --min-file-score "$MIN_FILE_SCORE"

      - name: Upload mutation report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report-${{ matrix.module }}
          path: ${{ matrix.module }}/reports/mutation/

      # A scheduled run notifies nobody but the author of its schedule: the failure is followed in an issue
      - name: Report the failure in an issue
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          MODULE: ${{ matrix.module }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Mutation testing: la mutation nocturne de $MODULE échoue"
          body="Le run $RUN_URL a échoué : un fichier muté est passé sous le plancher de $MIN_FILE_SCORE %, ou les tests ne passent plus. Le résumé du job liste les fichiers concernés, et le rapport HTML est en artefact."
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
          else
            gh issue create --title "$title" --label test --label "not end user" --body "$body"
          fi
