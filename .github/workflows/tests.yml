name: Module Tests

on:
  pull_request:
    branches: [ '**' ]
    paths: [ Lib/**, Discord/**, Core/**, Lang/**, .github/workflows/**, .github/actions/**, .github/scripts/test-reports-summary*, .github/scripts/patch-coverage*, .github/scripts/mutation-targets* ]
  push:
    branches: [ develop, master ]
    paths: [ Lib/**, Discord/**, Core/**, Lang/**, .github/workflows/**, .github/actions/**, .github/scripts/test-reports-summary*, .github/scripts/patch-coverage*, .github/scripts/mutation-targets* ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-all-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          # The merge commit of a pull request and its first parent, the base it is compared to
          fetch-depth: 2

      - name: Test the report scripts
        run: node --test .github/scripts/patch-coverage.test.mjs .github/scripts/test-reports-summary.test.mjs .github/scripts/mutation-targets.test.mjs

      - name: Setup Node.js and PNPM
        uses: ./.github/actions/setup-pnpm

      - name: Cache PNPM dependencies
        uses: actions/cache@v6
        with:
          path: |
            **/node_modules
          key: ${{ runner.os }}-all-deps-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-all-deps-

      - name: Install dependencies for all modules
        run: |
          pnpm --dir ./Lib install --frozen-lockfile
          pnpm --dir ./Discord install --frozen-lockfile
          pnpm --dir ./Core install --frozen-lockfile

      - name: Run Lib tests
        run: pnpm --dir ./Lib test:coverage

      - name: Upload Lib test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lib-test-results
          path: Lib/test-results.xml

      - name: create config file for Discord
        run: cp config/config.default.toml config/config.toml
        working-directory: ./Discord

      - name: Run Discord tests
        run: pnpm --dir ./Discord test:coverage

      - name: Upload Discord test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: discord-test-results
          path: Discord/test-results.xml

      - name: create config file for Core
        run: cp config/config.default.toml config/config.toml
        working-directory: ./Core

      - name: Run Core tests
        run: pnpm --dir ./Core test:coverage

      - name: Upload Core test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-test-results
          path: Core/test-results.xml

      - name: Coverage summary
        if: always()
        run: node .github/scripts/test-reports-summary.mjs coverage Lib Discord Core

      # The coverage of the whole modules hides untested new code: the lines a pull request adds must be covered too (#5165)
      - name: Coverage of the added lines
        if: success() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # Read at run time, so that adding the label then rerunning the job is enough
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' | grep -qx skip-patch-coverage; then
            echo "::notice::skip-patch-coverage label: the coverage of the added lines is reported without being enforced"
            node .github/scripts/patch-coverage.mjs HEAD^1 HEAD 0 Lib Discord Core
          else
            node .github/scripts/patch-coverage.mjs HEAD^1 HEAD 70 Lib Discord Core
          fi
