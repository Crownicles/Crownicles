services:
  mariadb_keycloak:
    # Pinned on the LTS branch: an untagged image follows `latest`, which jumps across major versions
    image: mariadb:12.3
    container_name: mariadb_keycloak
    volumes:
      # A named volume rather than a host folder: on a case-insensitive filesystem (macOS), MariaDB mixes up the upper case Keycloak tables
      - keycloak_mariadb:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: password
      # Runs mariadb-upgrade on startup when the data directory comes from an older version
      MARIADB_AUTO_UPGRADE: "1"
    # The image no longer ships mysqladmin: use its own healthcheck script
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      retries: 20
    ports:
      - 3307:3306
  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    container_name: keycloak
    ports:
      - 8080:8080
    deploy:
      resources:
        limits:
          memory: 1280M
        reservations:
          memory: 512M
    environment:
      # JVM config: 768m heap + 192m metaspace = 960m, leaving ~320m for JVM overhead (threads, code cache, direct buffers)
      # ExitOnOutOfMemoryError ensures clean shutdown instead of hanging on OOM
      JAVA_OPTS_APPEND: -Xms256m -Xmx768m -XX:MaxMetaspaceSize=192m -XX:+ExitOnOutOfMemoryError
      # JAVA_OPTS: -XX:UseSVE=0 # Uncomment for macOS due to a keycloak bug https://github.com/keycloak/keycloak/issues/36008
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # Without KC_DB, Keycloak silently falls back to its embedded H2 database
      KC_DB: mariadb
      KC_DB_URL: jdbc:mariadb://mariadb_keycloak:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      JGROUPS_DISCOVERY_PROTOCOL: JDBC_PING
      QUARKUS_TRANSACTION_MANAGER_OBJECT_STORE_DIRECTORY: /tmp
      QUARKUS_TRANSACTION_MANAGER_ENABLE_RECOVERY: true
    depends_on:
      mariadb_keycloak:
        condition: service_healthy
    command:
      - start-dev

volumes:
  keycloak_mariadb:
