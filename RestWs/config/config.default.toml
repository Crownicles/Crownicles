[global]
# Prefix used to prefix the MQTT topics and the databases
prefix = "crownicles"
# Debug mode
debug = false

[restApi]
# Allow registering of new users
allowRegister = true
# Port to run the REST API on
port = 10500

[webSocket]
# Port to run the WebSocket server on
port = 10501

[mqtt]
# MQTT host
host = "mqtt://127.0.0.1"

[keycloak]
# Keycloak realm
realm = "Crownicles"
# Keycloak URL
url = "http://127.0.0.1:8080"
# Keycloak client ID
clientId = "restWs"
# Keycloak client secret
clientSecret = ""

[accountDeletion]
# Shared secret used to derive the deletion codes. Must be the same as the one of the Discord bot,
# otherwise a code generated with /deletecode is rejected by the app. Generate with: openssl rand -hex 32
secret = ""
# Discord webhook called when a player asks for the deletion of their account. Leave empty to disable.
webhookUrl = ""

[accountDeletion.smtp]
# Mail server used to warn about a deletion request. Leave the host empty to disable the mails.
host = ""
port = 587
username = ""
password = ""
# Sender and recipient of the warning mails
from = ""
to = ""

[logs]
# The log level of the bot. It can be one of: "error", "warn", "info", "debug"
level = "info"
# The log locations. It can be one of: "console", "file", "loki"
locations = ["console", "file"]

[logs.loki]
# The loki host
host = "http://127.0.0.1:3100"
# Username to connect to loki
username = ""
# Password to connect to loki
password = ""
