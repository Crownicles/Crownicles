<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crownicles — Prototype mobile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Twemoji (graphismes CC-BY 4.0, Twitter puis jdecked) : rendu identique a Discord sur toutes les plateformes -->
<script src="https://cdn.jsdelivr.net/npm/@twemoji/api@17.0.3/dist/twemoji.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --ink:#0B0B0C;
  --muted:#6E6E73;
  --faint:#8A8A90;
  --paper:#FFFFFF;
  --wash:#F4F4F5;
  --line:#E6E6E8;
  --gold:#C8963C;
  --red:#D2504B;
  --green:#3F9A5C;
  --blue:#2F6FD0;
  --violet:#6C56C8;
  --radius:14px;
}

html,body{margin:0;height:100%}
body{
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:var(--ink);
  background:var(--wash);
  font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;
  font-feature-settings:"cv05","ss01";
}

/* ---------- chassis ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;padding:32px 16px}
.phone{
  position:relative;width:390px;height:844px;background:var(--paper);
  border-radius:38px;overflow:hidden;display:flex;flex-direction:column;
  border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.14);
}
.status{display:flex;justify-content:space-between;align-items:center;padding:12px 24px 4px;font-size:13px;font-weight:600;letter-spacing:-.01em}

/* ---------- entete ---------- */
.app-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 18px 10px}
.identity{display:flex;align-items:center;gap:10px;min-width:0;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.identity:active{opacity:.6}
.avatar{width:34px;height:34px;border-radius:10px;object-fit:cover;flex:none;background:var(--wash)}
.identity strong{display:block;font-size:15.5px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.identity small{display:block;font-size:12.5px;color:var(--muted);font-weight:500}
.head-actions{display:flex;gap:6px;flex:none}
.icon-btn{
  position:relative;width:34px;height:34px;border-radius:50%;border:0;background:var(--wash);
  font-size:15px;cursor:pointer;display:grid;place-items:center;padding:0;
}
.icon-btn:active{background:var(--line)}
.icon-btn .dot{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--red);border:1.5px solid var(--paper)}

/* ---------- barre de vitalite ---------- */
.vitals{display:flex;align-items:center;gap:14px;padding:0 18px 8px}
.vital{flex:1;min-width:0}
.vital-top{display:flex;justify-content:space-between;gap:6px;white-space:nowrap;font-size:11px;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:-.01em}
.vital-top b{color:var(--ink);font-variant-numeric:tabular-nums}
.wallet{display:flex;gap:6px;padding:0 18px 10px}
.chip{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:4px;background:var(--wash);
  border-radius:99px;padding:5px 10px;font-size:12px;font-weight:700;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  border:0;font-family:inherit;color:inherit;cursor:pointer;
}
.chip:active{background:var(--line)}

/* ---------- barre contextuelle ---------- */
.appbar{display:none;align-items:center;gap:8px;padding:4px 14px 10px;border-bottom:1px solid var(--line)}
.appbar.on{display:flex}
.appbar button{
  border:0;background:none;padding:4px 6px;margin-left:-6px;font:inherit;
  font-size:14px;font-weight:600;color:var(--blue);cursor:pointer;flex:none;
}
.appbar button:active{opacity:.55}
.appbar span{font-size:13px;font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- contenu ---------- */
.content{flex:1;overflow-y:auto;padding:16px 18px 26px;scrollbar-width:none}
.content::-webkit-scrollbar{display:none}
.screen{animation:enter .16s ease-out}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- typographie ---------- */
.eyebrow{font-size:11.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
h1{font-size:25px;line-height:1.16;font-weight:800;letter-spacing:-.035em;margin:0 0 6px}
h2{font-size:15.5px;font-weight:700;letter-spacing:-.02em;margin:0}
.hero{margin-bottom:18px}
.hero p{margin:0;color:var(--muted);font-size:14px}
.sub{color:var(--muted);font-size:13.5px;margin:0}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 9px}
.section-head:first-child{margin-top:0}
.section-head button{border:0;background:none;padding:0;cursor:pointer;font:inherit;font-size:13px;font-weight:600;color:var(--blue)}
.section-head button:active{opacity:.55}
.section-head .hint{font-size:12px;font-weight:600;color:var(--faint)}

/* ---------- panneaux et lignes ---------- */
.panel{border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--paper)}
.row{
  display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;
  background:none;border:0;border-top:1px solid var(--line);font:inherit;color:inherit;
}
button.row{cursor:pointer}
button.row:active{background:var(--wash)}
.panel > .row:first-child,.panel > .kv:first-child,.panel > .actions:first-child,.panel > .note:first-child{border-top:0}
.row-icon{font-size:20px;line-height:1;flex:none;min-width:24px;text-align:center}
.row-body{flex:1;min-width:0}
.row-body strong{display:block;font-size:14px;font-weight:600;letter-spacing:-.01em;overflow-wrap:anywhere}
.row-body small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35;overflow-wrap:anywhere}
.row-end{flex:none;max-width:40%;font-size:12px;font-weight:600;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.row-end.chev{font-size:17px;color:var(--faint);font-weight:400}
.row.danger .row-body strong{color:var(--red)}
.row.locked{opacity:.5}

.kv{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line);font-size:13.5px}
.kv span{color:var(--muted)}
.kv b{font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;text-align:right}
.note{padding:11px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}

.actions{display:flex;flex-wrap:wrap;gap:7px;padding:11px 14px;border-top:1px solid var(--line)}
.actions button{
  font:inherit;font-size:12.5px;font-weight:600;letter-spacing:-.01em;padding:7px 12px;cursor:pointer;
  border:1px solid var(--line);border-radius:99px;background:var(--paper);color:var(--ink);
}
.actions button:active{background:var(--wash)}
.actions button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* ---------- jauges ---------- */
.bar{height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.bar.red i{background:var(--red)}
.bar.green i{background:var(--green)}
.bar.blue i{background:var(--blue)}
.bar.gold i{background:var(--gold)}
.stat{display:block;padding:12px 14px;border-top:1px solid var(--line)}
.panel > .stat:first-child{border-top:0}
.stat label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.stat label b{color:var(--ink);font-variant-numeric:tabular-nums}

/* ---------- divers ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--muted);background:var(--wash);border-radius:99px;padding:3px 9px}
.tag.gold{color:var(--gold)}
.tag.green{color:var(--green)}
.tag.red{color:var(--red)}
.notice{display:flex;align-items:center;gap:11px;padding:12px 14px;border-radius:var(--radius);background:var(--wash);font-size:13px;color:var(--muted);margin:14px 0}
.notice strong{display:block;color:var(--ink);font-size:13.5px}
.notice .row-icon{font-size:19px}
.notice button{border:0;background:none;font:inherit;font-size:13px;font-weight:600;color:var(--blue);cursor:pointer;flex:none;padding:0}
.empty{padding:18px 14px;text-align:center;color:var(--muted);font-size:13px}

.button{
  appearance:none;font:inherit;font-size:14.5px;font-weight:600;letter-spacing:-.01em;
  padding:12px 20px;border-radius:99px;cursor:pointer;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
}
.button:active{transform:scale(.985);background:var(--wash)}
.button.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.button.danger{color:var(--red)}
.button.block{display:block;width:100%;text-align:center}
.button-row{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.button-row .button{flex:1;min-width:130px;text-align:center}

.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px}
.quick button{
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px;cursor:pointer;
  border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);
  font:inherit;font-size:11px;font-weight:600;color:var(--ink);letter-spacing:-.01em;
}
.quick button:active{background:var(--wash)}
.quick button i{font-style:normal;font-size:19px;line-height:1}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:12px}
.card b{display:block;font-size:14px}
.card small{display:block;color:var(--muted);font-size:12px;margin-top:2px}

/* ---------- voyage ---------- */
.travel-path{display:flex;align-items:center;gap:12px;padding:26px 14px 14px}
.travel-path .node{font-size:20px;line-height:1;flex:none}
.travel-path .track{flex:1;height:5px;border-radius:99px;background:var(--line);position:relative}
.travel-path .track i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.travel-path .runner{position:absolute;top:-21px;transform:translateX(-50%);font-size:16px;line-height:1}
.raw{
  display:block;padding:11px 13px;border-radius:var(--radius);background:var(--wash);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;line-height:1.7;overflow-wrap:anywhere;color:var(--muted);
}

/* ---------- combat ---------- */
.versus{display:flex;align-items:stretch;gap:8px;margin-bottom:12px}
.versus .side{flex:1;border:1px solid var(--line);border-radius:var(--radius);padding:11px;text-align:center}
.versus .side i{font-style:normal;font-size:22px;display:block;margin-bottom:4px}
.versus .side strong{display:block;font-size:13.5px;letter-spacing:-.01em}
.versus .side small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.versus .mid{align-self:center;font-size:12px;font-weight:700;color:var(--faint)}
.fight-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.fight-actions button{
  text-align:left;padding:10px 12px;border-radius:12px;border:1px solid var(--line);
  background:var(--paper);font:inherit;cursor:pointer;color:inherit;
}
.fight-actions button:active{background:var(--wash)}
.fight-actions button:disabled{opacity:.45;cursor:default}
.fight-actions b{display:block;font-size:13px}
.fight-actions small{display:block;color:var(--muted);font-size:11.5px}
.log{padding:12px 14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);white-space:pre-line;line-height:1.6}

/* ---------- navigation basse ---------- */
.bottom{display:flex;border-top:1px solid var(--line);padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:var(--paper)}
.bottom button{
  flex:1;border:0;background:none;cursor:pointer;padding:5px 2px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font:inherit;font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:-.01em;
}
.bottom button i{font-style:normal;font-size:18px;line-height:1;opacity:.55}
.bottom button.on{color:var(--ink)}
.bottom button.on i{opacity:1}

/* ---------- feuille modale ---------- */
.modal{position:absolute;inset:0;background:rgba(0,0,0,.35);display:none;align-items:flex-end;z-index:5}
.modal.on{display:flex}
.sheet{width:100%;background:var(--paper);border-radius:22px 22px 0 0;padding:18px 18px 22px;max-height:80%;overflow-y:auto;animation:up .22s cubic-bezier(.32,.72,0,1);scrollbar-width:none}
.sheet::-webkit-scrollbar{display:none}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.sheet-head h2{font-size:18px;letter-spacing:-.025em}
.close{width:30px;height:30px;padding:0;border-radius:50%;background:var(--wash);border:0;font-size:15px;cursor:pointer}
.search{width:100%;font:inherit;font-size:14px;padding:10px 13px;border-radius:11px;border:1px solid var(--line);background:var(--wash);margin-bottom:10px}
.search:focus{outline:none;border-color:var(--faint);background:var(--paper)}
.sheet-group{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.07em;margin:14px 0 6px}

/* ---------- notification ---------- */
.toast{
  position:absolute;left:18px;right:18px;bottom:86px;z-index:9;
  background:var(--ink);color:var(--paper);padding:12px 15px;border-radius:13px;
  font-size:13px;font-weight:500;opacity:0;transform:translateY(10px);transition:.22s;pointer-events:none;
}
.toast.on{opacity:1;transform:none}

/* ---------- panneau de pilotage ---------- */
.mockup-controls{
  position:fixed;right:18px;top:18px;width:198px;background:var(--paper);
  border:1px solid var(--line);border-radius:13px;padding:12px;
  display:flex;flex-direction:column;gap:6px;font-size:12px;
}
.mockup-controls strong{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
.mockup-controls button{
  font:inherit;font-size:12.5px;font-weight:600;padding:7px 10px;text-align:left;cursor:pointer;
  border:1px solid var(--line);border-radius:9px;background:var(--paper);
}
.mockup-controls button:active{background:var(--wash)}
.mockup-controls button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.mockup-controls hr{border:0;border-top:1px solid var(--line);margin:4px 0}
@media (max-width:940px){.mockup-controls{display:none}}

/* ---------- emojis Twemoji ---------- */
img.emoji{height:1em;width:1em;margin:0 .06em;vertical-align:-.12em;display:inline-block}
.row-icon img.emoji,.quick i img.emoji,.bottom i img.emoji,.versus .side i img.emoji{display:block;margin:0 auto}
</style>
</head>
<body>
<div class="stage">
  <div class="phone">
    <div class="status"><span>09:41</span><span>▰ ◔ 100%</span></div>

    <header class="app-head">
      <button class="identity" data-go="profile">

    <div class="vitals">
      <div class="vital">

    <div class="appbar" id="appbar"></div>
    <main class="content" id="content"></main>
    <nav class="bottom" id="bottom"></nav>

    <div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
    <div class="toast" id="toast"></div>
  </div>

  <aside class="mockup-controls" aria-label="Pilotage de la maquette">
    <strong>État du joueur</strong>
    <button data-demo="city">🛖 En ville</button>
    <button data-demo="travel">🧍 En voyage</button>
    <button data-demo="smallEvent">🪓 Mini-évènement</button>

    <button data-demo="reset">↺ Réinitialiser</button>
  </aside>
</div>

const DESTINATIONS = [

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const num = n => n.toLocaleString("fr-FR");
const pct = (a, b) => Math.max(0, Math.min(100, Math.round(a / b * 100)));

function trigger(o) {
  const parts = [];
  if (o.go) parts.push('data-go="' + o.go + '"');
  if (o.act) parts.push('data-act="' + o.act + '"');
  if (o.tab) parts.push('data-tab="' + o.tab + '"');
  if (o.sheet) parts.push('data-sheet="' + o.sheet + '"');
  if (o.toast) parts.push('data-toast="' + esc(o.toast) + '"');
  if (o.demo) parts.push('data-demo="' + o.demo + '"');
  return parts.join(" ");
}
const isButton = o => Boolean(o.go || o.act || o.toast || o.tab || o.sheet || o.demo);

function row(o) {
  const tag = isButton(o) ? "button" : "div";
  const cls = ["row", o.danger ? "danger" : "", o.locked ? "locked" : ""].filter(Boolean).join(" ");
  const end = o.end !== undefined
    ? '<span class="row-end">' + o.end + "</span>"
    : o.go ? '<span class="row-end chev">›</span>' : "";
  return "<" + tag + ' class="' + cls + '" ' + trigger(o) + ">"
    + (o.icon ? '<span class="row-icon">' + o.icon + "</span>" : "")
    + '<span class="row-body"><strong>' + o.title + "</strong>"
    + (o.sub ? "<small>" + o.sub + "</small>" : "") + "</span>"
    + end + "</" + tag + ">";
}

const rows = list => list.map(row).join("");
const panel = inner => '<div class="panel">' + inner + "</div>";
const kv = (label, value) => '<div class="kv"><span>' + label + "</span><b>" + value + "</b></div>";
const note = text => '<div class="note">' + text + "</div>";
const empty = text => '<div class="empty">' + text + "</div>";

function head(title, action) {
  return '<div class="section-head"><h2>' + title + "</h2>"
    + (action
      ? action.hint
        ? '<span class="hint">' + action.hint + "</span>"
        : "<button " + trigger(action) + ">" + action.label + "</button>"
      : "")
    + "</div>";
}

function hero(o) {
  return '<div class="hero">'
    + (o.eyebrow ? '<div class="eyebrow">' + o.eyebrow + "</div>" : "")
    + "<h1>" + o.title + "</h1>"
    + (o.text ? "<p>" + o.text + "</p>" : "") + "</div>";
}

function stat(label, value, ratio, tone) {
  return '<div class="stat"><label>' + label + " · <b>" + value + "</b></label>"
    + '<div class="bar ' + (tone || "") + '"><i style="width:' + ratio + '%"></i></div></div>';
}

function actions(list) {
  return '<div class="actions">' + list.map(b =>
    "<button " + trigger(b) + ' class="' + (b.on ? "on" : "") + '">' + b.label + "</button>").join("") + "</div>";
}

function notice(o) {
  return '<div class="notice">'
    + (o.icon ? '<span class="row-icon">' + o.icon + "</span>" : "")
    + "<div><strong>" + o.title + "</strong>" + (o.text ? o.text : "") + "</div>"
    + (o.action ? "<button " + trigger(o.action) + ">" + o.action.label + "</button>" : "")
    + "</div>";
}

function buttonRow(list) {
  return '<div class="button-row">' + list.map(b =>
    "<button " + trigger(b) + ' class="button ' + (b.style || "") + '">' + b.label + "</button>").join("") + "</div>";
}

function quick(list) {
  return '<div class="quick">' + list.map(b =>
    "<button " + trigger(b) + "><i>" + b.icon + "</i>" + b.label + "</button>").join("") + "</div>";
}

const $ = id => document.getElementById(id);

function renderVitals() {
  $("hdName").textContent = P.name;
  $("hdSub").textContent = "Niveau " + P.level + " · " + P.className;
  $("vHealth").textContent = P.health + " / " + P.maxHealth;
  $("vEnergy").textContent = num(P.energy) + " / " + num(P.maxEnergy);
  $("vHealthBar").style.width = pct(P.health, P.maxHealth) + "%";
  $("vEnergyBar").style.width = pct(P.energy, P.maxEnergy) + "%";
  $("wallet").innerHTML =
    '<button class="chip" data-go="shop">💰 ' + num(P.money) + "</button>"
    + '<button class="chip" data-go="royalMarket">💎 ' + P.gems + "</button>"
    + '<button class="chip" data-go="tokenMerchant">🪙 ' + P.tokens + "</button>";
}

function renderBottom() {
  const current = SCREENS[S.screen];
  $("bottom").innerHTML = TABS.map(t =>
    '<button data-tab="' + t.id + '" class="' + (current && current.tab === t.id ? "on" : "") + '">'
    + "<i>" + t.icon + "</i>" + t.label + "</button>").join("");
}

function renderAppbar() {
  const bar = $("appbar");
  if (!S.stack.length) {
    bar.className = "appbar";
    bar.innerHTML = "";
    return;
  }
  const parent = SCREENS[S.stack[S.stack.length - 1]];
  bar.className = "appbar on";
  bar.innerHTML = '<button data-act="back">‹ ' + (parent ? parent.title : "Retour") + "</button>"
    + "<span>" + (SCREENS[S.screen] ? SCREENS[S.screen].title : "") + "</span>";
}

function render() {
  const screen = SCREENS[S.screen] || SCREENS.adventure;
  $("content").innerHTML = '<div class="screen">' + screen.body() + "</div>";
  $("content").scrollTop = 0;
  renderVitals();
  renderBottom();
  renderAppbar();
  paintEmoji(document.body);
}

function paintEmoji(root) {
  if (window.twemoji) twemoji.parse(root, { folder: "svg", ext: ".svg" });
}

/* =====================================================================
   6. Navigation
   ===================================================================== */

function go(id) {
  if (!SCREENS[id] || id === S.screen) return;
  S.stack.push(S.screen);
  S.screen = id;
  render();
}

function back() {
  if (!S.stack.length) return;
  S.screen = S.stack.pop();
  render();
}

function openTab(id) {
  S.stack = [];
  S.screen = id;
  render();
}

let toastTimer;
let toastMuted = false;
function toast(text) {
  if (toastMuted) return;
  const el = $("toast");
  el.innerHTML = text;
  paintEmoji(el);
  el.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove("on"), 2600);
}

function openSheet(name) {
  const sheet = $("sheet");
  sheet.innerHTML = SHEETS[name] ? SHEETS[name]() : "";
  $("modal").classList.add("on");
  paintEmoji(sheet);
  const search = $("sheetSearch");
  if (search) {
    search.addEventListener("input", () => {
      const q = search.value.trim().toLowerCase();
      sheet.querySelectorAll("#sheetList .row").forEach(r => {
        r.style.display = !q || r.textContent.toLowerCase().includes(q) ? "" : "none";
      });
      sheet.querySelectorAll("#sheetList .panel").forEach(p => {
        const visible = [...p.querySelectorAll(".row")].some(r => r.style.display !== "none");
        p.style.display = visible ? "" : "none";
        const label = p.previousElementSibling;
        if (label && label.classList.contains("sheet-group")) label.style.display = visible ? "" : "none";
      });
    });
  }
}

function closeSheet() {
  $("modal").classList.remove("on");

function claim(kind) {
  S.daily[kind] = true;
  const labels = {
    bonus: "Bonus journalier utilisé : vous avancez de 1 h.",
    guild: "Récompense de guilde : chaque membre reçoit 1 240 💰.",
    mission: "Mission quotidienne terminée : +3 💎 et +450 ⭐.",
    potion: "Potion du jour achetée pour 1 840 💰.",
    meal: "Repas avalé : +250 ⚡."
  };
  toast(labels[kind]);
  render();
}

function fightAction(index) {
  const f = S.fight;
  const a = FIGHT_ACTIONS[index];
  if (!a || f.over || a.cost > f.breath) return;
  const damage = 6 + Math.floor(Math.random() * 14);
  const taken = 4 + Math.floor(Math.random() * 11);
  f.breath -= a.cost;
  f.log.push("Tour " + f.turn + " · " + a.icon + " " + a.name + " inflige " + damage + " ⚡ de dégâts.");
  f.foeHp = Math.max(0, f.foeHp - damage);
  if (f.foeHp > 0) {
    f.hp = Math.max(0, f.hp - taken);
    f.log.push("Arsène riposte et vous retire " + taken + " ⚡.");
  }
  f.breath = Math.min(P.maxBreath, f.breath + P.breathRegen);
  f.turn += 1;
  if (f.foeHp <= 0 || f.hp <= 0 || f.turn > 26) {
    f.over = true;
    S.screen = "fightResult";
  }
  render();
}

  surrender() {
    S.fight.hp = 0;
    S.fight.over = true;
    S.screen = "fightResult";
    render();
  },
  claimRent() {
    P.money += 1484;
    toast("1 484 💰 de rentes perçues chez le notaire.");
    render();
  },
  petPet() {
    toast("Votre main caresse " + P.pet.nickname + " qui se frotte contre vous. Cela n'a aucun effet sur son moral.");
  },
  feed() {
    P.pet.lovePoints = Math.min(110, P.pet.lovePoints + 3);
    P.pet.hungry = false;
    P.pet.love = P.pet.lovePoints >= 5 ? "🙀 Sauvage" : "😼 Fielleuse";
    toast(P.pet.nickname + " est rassasiée et semble heureuse. +3 💕");
    render();
  },
  water() { toast("2 emplacements arrosés : croissance accélérée de 5 %."); },
  harvest() { toast("Récolte effectuée : 2 🍀 Trèfle doré et 3 🌿 Herbe commune."); },
  plant() { toast("Graine de mousse lunaire plantée dans l'emplacement 4."); },
  compost() { toast("14 🌿 compostées : vous récupérez 6 🧱 matériaux."); },
  cook() { toast("Préparation lancée : le résultat sera prêt dans 20 minutes."); },
  ignite() { toast("Fourneau allumé : un matériau de type bois a été consommé."); },
  reroll() { toast("Recettes relancées pour un matériau de type bois."); },
  pin() { toast("Recette épinglée : elle sera conservée pour plus tard."); },
  sleep() {
    P.health = Math.min(P.maxHealth, P.health + 12);
    toast("Vous dormez : +12 ❤️. Plus de chambre d'auberge pendant 24 h.");
    render();
  },
  eat() {
    P.energy = Math.min(P.maxEnergy, P.energy + 250);
    S.daily.meal = true;
    toast("Repas avalé : +250 ⚡. Prochain repas dans 12 h.");
    render();
  },
  vet() {
    P.gems -= 3;
    P.pet.lovePoints = Math.min(110, P.pet.lovePoints + 15);
    toast("Consultation effectuée : +15 💕 pour " + P.pet.nickname + ".");
    render();
  },
  claimLeague() { toast("Récompense de ligue réclamée : 250 💰, 200 ⭐ et un équipement."); },
  language() { toast("Langue disponible : français, anglais, espagnol, allemand, italien, portugais."); },
  vote() { toast("Merci pour votre vote : un badge et une récompense vous attendent."); },
  unlock() { toast("Caution de 3 000 💰 versée : le joueur est libéré."); },
  joinBoat() { toast("Vous embarquez avec un membre de la guilde vers l'île mystérieuse."); },
  createGuild() { toast("La guilde a été créée et démarre avec 5 000 💰 de trésorerie."); },
  deposit() { toast("Don effectué : la commission de 5 % est plafonnée à 350 💰."); },
  upgradeBuilding() { toast("Bâtiment amélioré : 20 % du prix devient de l'expérience de guilde."); },
  upgradeHome() { toast("Maison portée au niveau 4 pour 18 500 💰."); },
  upgradeItem() { toast("Équipement amélioré : les matériaux ont été consommés."); },
  disenchant() { toast("Enchantement retiré pour 3 100 💰."); },
  enchant() { toast("Enchantement Énergie max I appliqué pour 5 000 💰 et 9 💎."); },
  recycle() { toast("Équipement démonté : vous récupérez les matériaux listés."); },
  buy() { toast("Achat effectué."); },
  buyFood() { toast("Nourriture ajoutée à l'entrepôt de la guilde."); },
  equipItem() { toast("Équipement échangé avec la réserve."); },
  sellItem() { toast("Objet vendu."); },
  throwItem() { toast("Potion versée dans un évier : aucune contrepartie."); },
  drinkPotion() { toast("Potion bue : vous avancez de 2 h."); },
  transfer() { toast("Transfert effectué avec le refuge de la guilde."); },
  free() { toast("Le familier a été libéré. Cette action est définitive."); },
  rename() { toast("Surnom modifié."); },
  clearNick() { toast("Surnom effacé."); },
  guildInvite() { toast("Invitation envoyée : le joueur doit confirmer son entrée."); },
  guildKick() { toast("Membre expulsé de la guilde."); },
  guildElder() { toast("Statut d'aîné mis à jour."); },
  guildDescription() { toast("Description de la guilde modifiée."); },
  guildLeave() { toast("Vous avez quitté la guilde."); },
  toggleNotif() { toast("Préférence de notification de l'application mise à jour."); }
};

function runAction(raw) {
  const [name, arg] = raw.split(":");
  if (name === "seg") {
    const [, group, value] = raw.split(":");
    S.seg[group] = value;
    return render();
  }
  if (name === "claim") return claim(arg);
  if (name === "fightAction") return fightAction(Number(arg));
  if (name === "buyToken") {
    const n = Number(arg);
    P.tokens = Math.min(P.tokensMax, P.tokens + n);
    P.money -= n === 1 ? 1200 : 3300;
    toast(n + " jeton" + (n > 1 ? "s" : "") + " acheté" + (n > 1 ? "s" : "") + ". Vous en avez " + P.tokens + ".");
    return render();
  }
  if (name === "setAlteration") {
    S.alteration = ALTERATIONS.find(a => a.name === arg) || S.alteration;
    return render();
  }
  if (name === "depart") {
    S.report = "travel";
    S.travelProgress = 0.02;
    S.stack = [];
    S.screen = "adventure";
    toast("Départ confirmé vers " + arg + ".");
    return render();
  }
  if (name === "event") {
    const outcomes = {
      repair: { icon: "🛠️", title: "La roue est réparée", text: "Le marchand vous glisse 640 💰 et une potion en remerciement." },
      horse: { icon: "🐎", title: "Vous perdez du temps", text: "Le trajet s'allonge de 40 minutes, mais vous gagnez 320 🏅." },
      nothing: { icon: "🚶", title: "Vous passez votre chemin", text: "Rien ne se produit. Parfois, ne rien faire est le bon choix." }
    };
    S.eventChoice = outcomes[arg];
    return render();
  }
  if (name === "expedition") {
    const e = EXPEDITIONS[Number(arg)];
    toast(P.pet.nickname + " part pour " + e.place + " · " + e.duration + " · " + e.rations + " 🍖 consommées.");
    return;
  }
  if (name === "changeClass") {
    P.className = arg;
    toast("Classe modifiée : " + arg + ". Prochain changement dans deux semaines.");
    return render();
  }
  const fn = ACTIONS[name];
  if (fn) fn();
}

/* =====================================================================
   9. Simulation d'états
   ===================================================================== */

const DEMOS = {
  city() { S.report = "city"; toast("Le joueur est arrivé en ville."); },
  travel() { S.report = "travel"; S.travelProgress = 0.42; toast("Le joueur est reparti sur les routes."); },
  smallEvent() { S.report = "smallEvent"; toast("Un mini-évènement se déclenche."); },
  bigEvent() { S.report = "bigEvent"; S.eventChoice = null; toast("Un évènement à choix se déclenche."); },
  alteration() { S.report = "alteration"; toast("Le joueur subit une altération d'état."); },
  island() { S.report = "island"; toast("Le joueur débarque sur l'île de glace."); },
  dead() { S.report = "dead"; P.health = 0; toast("Le personnage est mort : toutes les commandes sont bloquées."); },
  advance() {
    if (S.report === "travel") {
      S.travelProgress = Math.min(1, S.travelProgress + 0.25);
      if (S.travelProgress >= 1) {
        S.report = "city";
        toast("Vous arrivez à destination : vous êtes en ville.");
      } else {
        toast("Le temps avance : un mini-évènement a été résolu.");
      }
    } else if (S.report === "alteration") {
      S.report = "travel";
      toast("L'altération s'est dissipée d'elle-même.");
    } else {
      S.report = "travel";
      S.travelProgress = 0.1;
      toast("Le joueur reprend la route.");
    }
  },
  reset() {
    S.report = "city";
    S.eventChoice = null;
    S.alteration = ALTERATIONS[9];
    S.travelProgress = 0.42;
    S.daily = { bonus: false, guild: false, mission: false, potion: false, meal: false };
    S.fight = { turn: 1, hp: 82, foeHp: 94, breath: 8, log: [], over: false };
    P.health = 82; P.energy = 612; P.money = 11197; P.gems = 51; P.tokens = 14;
    P.pet.lovePoints = 4; P.pet.hungry = true; P.pet.love = "😼 Fielleuse";
    toast("Maquette réinitialisée.");
  }
};

function runDemo(name, silent) {
  const fn = DEMOS[name];
  if (!fn) return;
  toastMuted = Boolean(silent);
  fn();
  toastMuted = false;
  if (!["advance", "reset"].includes(name) || S.screen !== "adventure") {
    S.stack = [];
    S.screen = "adventure";
  }
  document.querySelectorAll(".mockup-controls button").forEach(b =>
    b.classList.toggle("on", b.dataset.demo === S.report));
  render();
}

/* =====================================================================
   10. Écoute des interactions
   ===================================================================== */

document.addEventListener("click", event => {
  const target = event.target.closest("[data-go],[data-act],[data-tab],[data-sheet],[data-toast],[data-demo]");
  if (!target) return;
  const d = target.dataset;
  if (d.demo) return runDemo(d.demo);
  if (d.sheet) return openSheet(d.sheet);
  if (d.tab) { closeSheet(); return openTab(d.tab); }
  if (d.act) return runAction(d.act);
  if (d.go) { closeSheet(); return go(d.go); }
  if (d.toast) return toast(d.toast);
});

$("modal").addEventListener("click", event => {
  if (event.target === $("modal")) closeSheet();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    if ($("modal").classList.contains("on")) closeSheet();
    else back();
  }
});

runDemo("city", true);
</script>
